name: tls-cert-checker

services:
  tls-checker:
    build: .
    image: tls-cert-checker:local
    container_name: tls-cert-checker
    ports:
      - "8000:8000"
    environment:
      TLS_CHECKER_DB: /data/tls_checker.db
      SEED_DEMO: "1"          # 置 "0" 则启动时不写入演示数据
    volumes:
      - tls-checker-data:/data
    restart: unless-stopped

volumes:
  tls-checker-data:
